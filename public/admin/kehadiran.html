<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kehadiran - Admin Nusa Les Calistung</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-page="kehadiran">

<header class="site-header">
    <div class="container header-top">
        <a href="/admin/dashboard.html" class="brand-title">Nusa Les Calistung <span class="brand-badge">Panel Pengelola</span></a>
        <div class="header-actions">
            <a href="/index.html" target="_blank" class="btn btn-outline btn-sm">Lihat Web Publik</a>
            <button type="button" onclick="App.logout()" class="btn btn-danger btn-sm">Logout</button>
        </div>
    </div>
    <nav class="tab-bar">
        <div class="container">
            <ul class="tab-list">
                <li><a href="/admin/dashboard.html">Beranda</a></li>
                <li><a href="/admin/murid.html">Murid & Ortu</a></li>
                <li><a href="/admin/verifikasi.html">Verifikasi</a></li>
                <li><a href="/admin/kehadiran.html" class="active">Kehadiran</a></li>
                <li><a href="/admin/jurnal.html">Jurnal</a></li>
                <li><a href="/admin/pembayaran.html">Pembayaran</a></li>
                <li><a href="/admin/pengaturan.html">Info Web</a></li>
                <li><a href="/admin/akun.html">Akun</a></li>
            </ul>
        </div>
    </nav>
</header>

<main class="main-content">
    <div class="container">
        <div id="alertAdmin" class="alert hidden"></div>

        <form id="formSimpanAbsen" class="card">
            <div class="card-header">
                <span id="labelTglAbsen">Daftar Hadir Pertemuan</span>
                <div class="inline-form">
                    <input type="date" id="inputTglAbsen" class="form-control" style="width: auto; padding: 6px 10px;">
                    <button type="button" id="btnMuatAbsen" class="btn btn-outline btn-sm">Muat Tanggal</button>
                    <button type="submit" class="btn btn-primary btn-sm">Simpan Absensi</button>
                </div>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 60px;">No</th>
                            <th>Nama Murid</th>
                            <th>Status Kehadiran</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyAbsen">
                        <tr><td colspan="3">Memuat daftar murid...</td></tr>
                    </tbody>
                </table>
            </div>
        </form>
    </div>
</main>

<footer class="footer">
    <div class="container footer-inner">
        <span>&copy; 2026 Nusa Les Calistung</span>
        <span>Panel Administrasi Pengajar</span>
    </div>
